<style>

*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:13px Sarabun,system-ui,sans-serif}

::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2c3642;border-radius:8px;border:2px solid var(--pn)}
</style></head><body>
<div id="err"></div>
<div class="app">
 <div class="top"><div class="logo">Simulation<b>Redline</b></div><span class="hint">By Operation Planning and Analysis Section (OPS)</span>
  <div class="sp"></div>
  <button class="tb" id="bFit">⤢ พอดีจอ</button><button class="tb" id="bDemo">↺ ตัวอย่าง</button>
  <button class="tb" id="bSave">⬇ บันทึก</button>
  <label class="tb" style="margin:0">⬆ เปิด<input type="file" id="fIn" accept=".json" hidden></label></div>
 <div class="main">
  <div class="left"><div class="tabs"><button class="tab on" data-tab="tr">🚆 ขบวน &amp; เส้นทาง</button><button class="tab" data-tab="bd">🛠 สร้างราง</button></div><div id="lp"></div></div>
  <div class="stage"><canvas id="cv"></canvas>
   <div class="hudc" id="hud"></div><div class="banner" id="bn"></div>
   <div class="clock">
    <div class="crow"><button class="cb" id="cRs" title="เริ่มใหม่">⏮</button><button class="cb" id="cBk" title="ย้อน 5 นาที">«</button>
     <div class="ctime" id="ct">05:00</div><button class="cb" id="cFw" title="ข้าม 5 นาที">»</button></div>
    <div class="crow"><button class="cb" id="cPl">⏸</button><span id="spd"></span>
     <input class="tin" id="cIn" value="05:30"><button class="sx" id="cGo">ไปเวลา</button></div></div></div>
 </div>
 <div class="upc"><span class="upt">🕒 UPCOMING TRAINS</span><div id="upl"></div></div>
</div>
<div id="mask"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>
<script>
"use strict";
window.addEventListener('error',e=>{const b=document.getElementById('err');b.style.display='block';b.textContent='⚠ '+e.message+' [บรรทัด '+e.lineno+']';});
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const D2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,f)=>({x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val=id=>{const e=$(id);return e?e.value:'';};
function hm(t){if(t==null||isNaN(t))return'--:--';t=Math.round(t);t=((t%86400)+86400)%86400;return p2(Math.floor(t/3600))+':'+p2(Math.floor(t%3600/60));}
function pT(s){const m=String(s||'').trim().match(/^(\d{1,2})[:.]?(\d{2})(?:[:.](\d{2}))?$/);if(!m||+m[2]>59)return null;return +m[1]*3600+ +m[2]*60+(m[3]?+m[3]:0);}
function mmss(s){const n=s<0;s=Math.abs(Math.round(s||0));return(n?'-':'')+p2(Math.floor(s/60))+':'+p2(s%60);}
function toast(m,k){const d=document.createElement('div');d.className='ts '+(k||'');d.textContent=m;$('toast').appendChild(d);setTimeout(()=>d.remove(),2600);}
function shade(h,a){let n=parseInt(String(h).slice(1),16);if(isNaN(n))n=0xd42a37;const f=c=>Math.round(a>0?c+(255-c)*a:c*(1+a));return'rgb('+f(n>>16)+','+f(n>>8&255)+','+f(n&255)+')';}

/* ═════════ ค่าคงที่ ═════════ */
const PXM=2,NCAR=4,CAR=21,GAP=1.8,TL=NCAR*CAR+(NCAR-1)*GAP,ACC=0.8/PXM,DEC=0.9/PXM,GRID=10;
const kp=k=>Math.max(5,k)/3.6/PXM;
const tt=(px,v)=>px*PXM/(Math.max(10,v)/3.6*0.88);

/* ═════════ โลก ═════════ */
let W={nodes:[],edges:[],sts:[],trains:[],seq:1};
let NM={},EM={},SM={},ADJ={},NETV=1,RES={},TRM={};
const SIM={t:18000,run:true,mul:10};
const UI={tab:'tr',sel:null,add:false,tool:'track',cas:true};
const nid=p=>p+(W.seq++);
function reindex(){NM={};EM={};SM={};ADJ={};
 W.nodes.forEach(n=>{NM[n.id]=n;ADJ[n.id]=[];});W.sts.forEach(s=>SM[s.id]=s);
 W.edges=W.edges.filter(e=>NM[e.a]&&NM[e.b]&&e.a!==e.b);
 W.edges.forEach(e=>{e.len=D2(NM[e.a],NM[e.b]);EM[e.id]=e;ADJ[e.a].push(e.id);ADJ[e.b].push(e.id);});NETV++;}
const oth=(E,n)=>E.a===n?E.b:E.a;
const stName=id=>SM[id]?SM[id].name:'?';
const stCode=id=>SM[id]?SM[id].code:'?';
const TR=id=>W.trains.find(t=>t.id===id);
function addNode(x,y){const n={id:nid('n'),x,y};W.nodes.push(n);NM[n.id]=n;ADJ[n.id]=[];return n;}
function addEdge(a,b,o){if(!a||!b||a===b)return null;for(const e of W.edges)if((e.a===a&&e.b===b)||(e.a===b&&e.b===a))return e;
 const e=Object.assign({id:nid('e'),a,b,kind:'track',st:null,pf:'',vmax:100},o||{});W.edges.push(e);reindex();return e;}
function cleanNodes(){W.nodes=W.nodes.filter(n=>W.edges.some(e=>e.a===n.id||e.b===n.id));reindex();}
function delEdge(id){W.edges=W.edges.filter(e=>e.id!==id);cleanNodes();}
function splitEdge(E,x,y){const n=addNode(Math.round(x),Math.round(y)),o={kind:E.kind,st:E.st,pf:E.pf,vmax:E.vmax};
 W.edges=W.edges.filter(q=>q.id!==E.id);reindex();addEdge(E.a,n.id,o);addEdge(n.id,E.b,o);return n;}
function outerN(E){return(ADJ[E.a]||[]).length<=1?E.a:E.b;}
function nodeNear(x,y,r){let b=null,bd=r;for(const n of W.nodes){const d=Math.hypot(n.x-x,n.y-y);if(d<bd){bd=d;b=n;}}return b;}
function edgeNear(x,y,r){let best=null,bd=r;for(const e of W.edges){const A=NM[e.a],B=NM[e.b],vx=B.x-A.x,vy=B.y-A.y,L2=vx*vx+vy*vy;if(!L2)continue;
 const t=Math.max(0,Math.min(1,((x-A.x)*vx+(y-A.y)*vy)/L2)),px=A.x+vx*t,py=A.y+vy*t,d=Math.hypot(px-x,py-y);if(d<bd){bd=d;best={e,x:px,y:py,t};}}return best;}
function stEdges(sp){let a=W.edges.filter(e=>(e.kind==='plat'||e.kind==='portal')&&e.st===sp.st);
 if(sp.pf){const b=a.filter(e=>String(e.pf)===String(sp.pf));if(b.length)a=b;}return a;}
function tset(sp){const T={};stEdges(sp).forEach(e=>T[e.id]=1);return T;}
function onDist(E){return Math.max(Math.min(TL+2,E.len-2),Math.min(E.len-2,E.len/2+TL/2));}
function cumOf(P){const C=[0];for(let i=1;i<P.length;i++)C.push(C[i-1]+D2(P[i-1],P[i]));return C;}
function atP(P,C,d){if(d<=0)return P[0];const n=C.length-1;if(d>=C[n])return P[n];let lo=0,hi=n;
 while(hi-lo>1){const m=(lo+hi)>>1;if(C[m]<=d)lo=m;else hi=m;}const s=C[hi]-C[lo];return s>0?lerp(P[lo],P[hi],(d-C[lo])/s):P[lo];}
const at=(r,d)=>atP(r.pts,r.cum,d);
function sliceP(P,C,a,b){const o=[atP(P,C,a)];for(let i=0;i<P.length;i++)if(C[i]>a&&C[i]<b)o.push(P[i]);o.push(atP(P,C,b));return o;}
const lenOf=P=>{let s=0;for(let i=1;i<P.length;i++)s+=D2(P[i-1],P[i]);return s;};

/* ═════════ ค้นหาเส้นทาง ═════════ */
function hdg(E,from){const a=NM[from],b=NM[oth(E,from)];return Math.atan2(b.y-a.y,b.x-a.x);}
function angOK(i1,n,i2){const E1=EM[i1],E2=EM[i2];let d=Math.abs(hdg(E1,oth(E1,n))-hdg(E2,n));if(d>Math.PI)d=2*Math.PI-d;return d<=1.0;}
function route(starts,T,tid){
 const Q=[],seen={};let g=0;
 starts.forEach(s=>Q.push({e:s.e,x:s.x,c:s.c,s,par:null}));
 while(Q.length&&g++<20000){
  let bi=0;for(let i=1;i<Q.length;i++)if(Q[i].c<Q[bi].c)bi=i;
  const q=Q.splice(bi,1)[0];
  if(q.fin){const ch=[];let p=q.par;while(p.par){ch.unshift({e:p.e,exit:p.x});p=p.par;}return{s:p.s,chain:ch,tgt:{e:q.e,entry:q.par.x}};}
  const k=q.e+'>'+q.x;if(seen[k])continue;seen[k]=1;
  for(const e2 of ADJ[q.x]||[]){if(e2===q.e||!angOK(q.e,q.x,e2))continue;const E=EM[e2];let pen=0;
   if(tid){const r=RES['e'+e2];if(r&&r!==tid)pen+=3000;const rn=RES['n'+q.x];if(rn&&rn!==tid)pen+=1500;}
   if(T[e2])Q.push({fin:1,e:e2,c:q.c+E.len/2+pen,par:q});
   else Q.push({e:e2,x:oth(E,q.x),c:q.c+E.len+pen,par:q});}}
 return null;}
function spawnOpts(E){if(E.kind==='portal'){const O=outerN(E);return[{e:E.id,x:oth(E,O),c:0,p:{x:NM[O].x,y:NM[O].y}}];}
 const c=lerp(NM[E.a],NM[E.b],.5);return[{e:E.id,x:E.a,c:0,p:c},{e:E.id,x:E.b,c:0,p:c}];}
function poseOpts(P,rev){const E=EM[P.e],o=[{e:P.e,x:P.face,c:D2(P.hp,NM[P.face]),p:P.hp}];
 if(rev){const b=oth(E,P.face);o.push({e:P.e,x:b,c:D2(P.tp,NM[b])+400,p:P.tp,rev:1});}return o;}
function planChain(opts,S,i,tid){
 const pts=[],items=[],wps=[],spd=[],hops=[];let d=0,pa=0,carry=0,starts=opts,start=null,end=null,ha=Infinity;
 const add=p=>{const l=pts[pts.length-1];if(!l||D2(l,p)>.01)pts.push({x:p.x,y:p.y});};
 const it=(k,e)=>items.push({k,end:e});
 for(let j=i+1;j<S.length;j++){
  const sp=S[j],wp=!!sp.pass&&j<S.length-1,r=route(starts,tset(sp),tid);if(!r)return{fail:j};
  const s=r.s;if(!start)start=s;const h={j,a:pa,t:carry};carry=0;
  if(!s.ch){add(s.p);const sx=NM[s.x],d1=D2(s.p,sx),E=EM[s.e];spd.push({a:d,b:d+d1,v:E.vmax});h.t+=tt(d1,E.vmax);d+=d1;add(sx);it('e'+s.e,d);it('n'+s.x,d);}

 const rH=Math.min(l/2,isH?w*.5:w*.22),rT=Math.min(l/2,isT?w*.4:w*.22);
 c.save();c.translate(1,1.6);c.fillStyle='rgba(0,0,0,.5)';carPath(l,w,rT,rH);c.fill();c.restore();
 const g=c.createLinearGradient(0,-w/2,0,w/2);g.addColorStop(0,shade(col,.4));g.addColorStop(.45,col);g.addColorStop(1,shade(col,-.5));
 c.fillStyle=g;carPath(l,w,rT,rH);c.fill();c.lineWidth=sel?1.8:.8;c.strokeStyle=sel?'#ffd84a':'rgba(20,0,0,.65)';c.stroke();
 if(l>6){c.fillStyle='rgba(255,255,255,.85)';c.fillRect(-l/2+rT+1,-w*.09,Math.max(0,l-rT-rH-2),w*.18);}
 if(l>10&&w>5){c.fillStyle='rgba(15,20,30,.72)';const st=Math.max(3.2,w*.62);
  for(let x=-l/2+rT+2;x<l/2-rH-2;x+=st){c.fillRect(x,-w/2+.9,st*.55,w*.15);c.fillRect(x,w/2-.9-w*.15,st*.55,w*.15);}}
 if(isH){c.fillStyle='rgba(22,32,48,.95)';c.beginPath();c.ellipse(l/2-w*.34,0,w*.14,w*.32,0,0,7);c.fill();}
 c.restore();}
function drawTrain(tr){const r=tr.rt,c=ctx,sel=UI.sel===tr.id,w=Math.max(4.4,7*V.z);let head=null,ha=0,tail=null,ta=0;
 for(let k=0;k<NCAR;k++){let f=r.hs-k*(CAR+GAP),b=f-CAR;if(f<=r.hb||b>=r.ha)continue;b=Math.max(b,r.hb);f=Math.min(f,r.ha);if(f-b<.4)continue;
  const F=w2s(at(r,f)),B=w2s(at(r,b));if(k===0){head=F;ha=Math.atan2(F.y-B.y,F.x-B.x);}tail=B;ta=Math.atan2(F.y-B.y,F.x-B.x);
  drawCar(F,B,w,tr.color,k===0,k===NCAR-1,sel);}
 if(head&&r.state!=='end'){const hx=head.x+Math.cos(ha)*w,hy=head.y+Math.sin(ha)*w,R=w*(r.v>.2?3.6:2.4),g=c.createRadialGradient(hx,hy,0,hx,hy,R);
  g.addColorStop(0,'rgba(255,244,214,.8)');g.addColorStop(1,'rgba(255,244,214,0)');c.fillStyle=g;c.beginPath();c.arc(hx,hy,R,0,7);c.fill();}
 if(tail){c.fillStyle='#ff2d3d';const px=-Math.sin(ta),py=Math.cos(ta);for(const s of[-1,1]){c.beginPath();c.arc(tail.x+px*w*.3*s,tail.y+py*w*.3*s,Math.max(1,w*.13),0,7);c.fill();}}
 if(head&&(V.z>.28||sel)){const S=tr.stops,j=r.state==='run'&&r.end?r.end.j:r.si,sp=S[j];
  let t=tr.no+'  '+(r.state==='run'?'▸ ':r.blocked?'🔴 ':'⏸ ')+(sp?stCode(sp.st):'')+(sp&&sp.pf?' ·'+sp.pf:'');
  const lt=r.dly>45?' +'+mmss(r.dly):'';c.font='700 10px Sarabun';const tw=c.measureText(t+lt).width+10,lx=head.x-tw/2,ly=head.y+w+9;
  c.fillStyle='rgba(6,9,14,.82)';rrect(lx,ly-7,tw,14,5);c.fill();c.textAlign='left';c.fillStyle='#e8edf4';c.fillText(t,lx+5,ly+.5);
  if(lt){c.fillStyle='#fbbf24';c.fillText(lt,lx+5+c.measureText(t).width,ly+.5);}}}
function hitTrain(mx,my){for(const t of W.trains){const r=t.rt;if(!r)continue;for(let k=0;k<NCAR;k++){const f=r.hs-k*(CAR+GAP)-CAR/2;
 if(f<r.hb||f>r.ha)continue;const p=w2s(at(r,f));if(Math.hypot(p.x-mx,p.y-my)<11)return t;}}return null;}

function nextNo(){let m=1000;W.trains.forEach(t=>{const n=parseInt(t.no);if(!isNaN(n)&&n>m)m=n;});return m+1;}
function mkTrain(o){const t={id:o.id||nid('t'),no:String(o.no||nextNo()),color:o.color||'#d42a37',stops:o.stops||[],ver:1,rt:null,done:false,rec:[]};W.trains.push(t);return t;}
function fixEnds(tr){const S=tr.stops;if(!S.length)return;const f=S[0];if(f.dep==null)f.dep=f.arr!=null?f.arr:Math.ceil(SIM.t/60)*60;f.arr=null;f.pass=false;
 if(S.length>1){const l=S[S.length-1];if(l.arr==null)l.arr=l.dep;l.dep=null;l.pass=false;}
 for(let i=1;i<S.length-1;i++){const s=S[i];if(s.arr==null)s.arr=s.dep;if(s.dep==null)s.dep=s.pass?s.arr:s.arr+60;}}
function addStop(tr,e){const S=tr.stops,sp={st:e.st,pf:String(e.pf||''),arr:null,dep:null,pass:false};
 if(!S.length){sp.dep=Math.ceil((SIM.t+120)/60)*60;S.push(sp);}
 else{const pr=S[S.length-1];if(S.length>1&&pr.dep==null)pr.dep=pr.arr+60;const base=pr.dep!=null?pr.dep:pr.arr;S.push(sp);tr.ver++;
  const sg=preview(tr).segs.find(s=>s.j===S.length-1);sp.arr=Math.ceil((base+(sg?sg.t:180))/60)*60;}
 tr.ver++;renderLeft();toast('เพิ่ม '+stName(e.st)+(e.pf?' · ชานชาลา '+e.pf:''));}
function autoTimes(tr){const S=tr.stops;if(S.length<2)return;tr.ver++;const pv=preview(tr);
 let t=S[0].dep!=null?S[0].dep:Math.ceil(SIM.t/60)*60;S[0].dep=t;S[0].arr=null;
 for(let j=1;j<S.length;j++){const sg=pv.segs.find(s=>s.j===j);t+=sg?sg.t:180;const sp=S[j];
  if(j===S.length-1){sp.arr=Math.ceil(t/60)*60;sp.dep=null;sp.pass=false;}
  else if(sp.pass){sp.arr=sp.dep=Math.round(t/60)*60;t=sp.arr;}
  else{sp.arr=Math.ceil(t/60)*60;sp.dep=sp.arr+60;t=sp.dep;}}tr.ver++;}

  '<div class="sec"><h4>🚉 สถานี &amp; ทางเข้า-ออก ('+W.sts.length+')</h4>'+
  (W.sts.map(s=>'<div class="srow"><span class="pill">'+(s.type==='portal'?'🚪':'🚉')+' '+W.edges.filter(e=>e.st===s.id).length+'</span><input data-sname="'+s.id+'" value="'+esc(s.name)+'"><input data-scode="'+s.id+'" value="'+esc(s.code)+'" style="max-width:60px"><button class="x" data-sdel="'+s.id+'">✕</button></div>').join('')||'<div class="hint">ยังไม่มีสถานี</div>')+'</div>'+

 else if(!UI.sel||!TR(UI.sel)){UI.sel=null;

 else{const tr=TR(UI.sel),pv=preview(tr),s=status(tr);

  (pv.err?'<div class="err2">'+esc(pv.err)+'</div>':'')+
  (tr.stops.length?tr.stops.map((_,i)=>cardHTML(tr,i,pv)).join(''):'<div class="hint" style="margin-bottom:8px">กดปุ่มด้านล่าง แล้วคลิกชานชาลา (PF) หรือทางเข้า-ออกบนแผนที่ตามลำดับที่ต้องการให้รถวิ่ง</div>')+
  '<button class="bt w'+(UI.add?' on':' p')+'" data-act="add">'+(UI.add?'✔ เสร็จสิ้นการเพิ่มจุดจอด':'➕ เพิ่มจุดจอด (คลิกบนแผนที่)')+'</button>'+

function renderBanner(){const b=$('bn'),tr=TR(UI.sel);
 if(UI.tab==='tr'&&UI.add&&tr){b.style.display='block';b.textContent='🖱 คลิกชานชาลา (PF) หรือทางเข้า-ออกบนแผนที่ เพื่อเพิ่มจุดจอดให้ขบวน '+tr.no+' · Esc = เสร็จ';}
 else if(UI.tab==='bd'&&UI.tool==='track'){b.style.display='block';b.style.background='#1d2a14';b.textContent='➕ วาดราง: คลิกต่อเนื่อง · ชนรางเดิม = ประแจ · คลิกขวา = จบเส้น';return;}

$('lp').addEventListener('mouseenter',()=>LPH=true);$('lp').addEventListener('mouseleave',()=>LPH=false);
$('lp').addEventListener('click',ev=>{const b=ev.target.closest('[data-act],[data-tr],[data-tool],[data-pf],[data-tadj],[data-pass],[data-rm],[data-mv],[data-focus],[data-sdel]');if(!b)return;
 const d=b.dataset,tr=TR(UI.sel);
 if(d.tr){selectTrain(d.tr);return;}
 if(d.tool){UI.tool=d.tool;DR=null;cleanNodes();renderLeft();return;}
 if(d.sdel){delStation(d.sdel);return;}
 if(d.pf!=null&&tr){const[i,pf]=d.pf.split('|');tr.stops[+i].pf=pf;tr.ver++;renderLeft();return;}
 if(d.tadj&&tr){const[i,f,dv]=d.tadj.split('|');adjT(tr,+i,f,+dv);return;}
 if(d.pass&&tr){const sp=tr.stops[+d.pass];sp.pass=!sp.pass;sp.dep=sp.pass?sp.arr:sp.arr+60;tr.ver++;renderLeft();return;}
 if(d.rm&&tr){tr.stops.splice(+d.rm,1);fixEnds(tr);tr.ver++;renderLeft();return;}
 if(d.mv&&tr){const[i,s]=d.mv.split('|').map(Number),j=i+s,S=tr.stops;if(j<0||j>=S.length)return;const t=S[i];S[i]=S[j];S[j]=t;fixEnds(tr);autoTimes(tr);renderLeft();return;}
 if(d.focus&&tr){focusPt(preview(tr).marks[+d.focus]);return;}
 const a=d.act;
 if(a==='new'){const t=mkTrain({});UI.add=true;selectTrain(t.id);}
 else if(a==='autoall'){W.trains.forEach(autoTimes);renderLeft();toast('จัดเวลาอัตโนมัติทุกขบวนแล้ว');}
 else if(a==='back'){UI.sel=null;UI.add=false;renderLeft();}
 else if(a==='deltr'&&tr){if(!confirm('ลบขบวน '+tr.no+' ?'))return;if(tr.rt)despawn(tr);W.trains=W.trains.filter(t=>t!==tr);UI.sel=null;UI.add=false;renderLeft();}
 else if(a==='add'){UI.add=!UI.add;renderLeft();}
 else if(a==='auto'&&tr){autoTimes(tr);renderLeft();toast('คำนวณเวลาจากผังรางแล้ว');}
 else if(a==='dup'&&tr)dlgDup(tr);
 else if(a==='fit')fit();
 else if(a==='demo'){if(confirm('โหลดตัวอย่างทับของเดิม?'))demo();}
 else if(a==='clr'){if(confirm('ล้างผังและขบวนทั้งหมด?')){W={nodes:[],edges:[],sts:[],trains:[],seq:1};reindex();resetSim();UI.sel=null;renderLeft();}}});
$('lp').addEventListener('change',ev=>{const t=ev.target,d=t.dataset,tr=TR(UI.sel);
 if(d.tin&&tr){const[i,f]=d.tin.split('|'),v=pT(t.value),sp=tr.stops[+i];if(v==null){toast('รูปแบบเวลาไม่ถูกต้อง เช่น 05:30','er');renderLeft();return;}adjT(tr,+i,f,v-sp[f]);return;}
 if(d.tno!=null&&tr){tr.no=t.value.trim()||tr.no;renderLeft();return;}
 if(d.tcol!=null&&tr){tr.color=t.value;return;}
 if(d.cas!=null){UI.cas=t.checked;return;}
 if(d.sname){SM[d.sname].name=t.value;renderLeft();return;}
 if(d.scode){SM[d.scode].code=t.value.toUpperCase();renderLeft();}});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{UI.tab=b.dataset.tab;UI.add=false;DR=null;cleanNodes();

/* ═════════ แถบล่าง / HUD ═════════ */
function renderUpc(){const L=[];W.trains.forEach(t=>{if(t.done||t.stops.length<2)return;const r=t.rt;
 if(!r)L.push({t,tm:t.stops[0].dep});else if(r.state==='dwell')L.push({t,tm:r.dwU});});
 L.sort((a,b)=>a.tm-b.tm);
 $('upl').innerHTML=L.slice(0,12).map(o=>{const S=o.t.stops;return'<div class="uc" data-tr="'+o.t.id+'"><div class="a"><span style="color:'+o.t.color+'">■</span> '+esc(o.t.no)+
  ' <span style="color:#8592a5">'+hm(o.tm)+'</span></div><div class="b" style="background:'+o.t.color+'">'+esc(stName(S[0].st))+' → '+esc(stName(S[S.length-1].st))+'</div></div>';}).join('')||'<span class="hint">ไม่มีขบวนที่กำลังจะออก</span>';}
$('upl').addEventListener('click',e=>{const b=e.target.closest('[data-tr]');if(b)selectTrain(b.dataset.tr);});
function renderHud(){const run=W.trains.filter(t=>t.rt).length,late=W.trains.filter(t=>t.rt&&t.rt.dly>60).length,wait=W.trains.filter(t=>t.rt&&t.rt.blocked).length;
 $('hud').innerHTML='<span class="chip">🚉 '+W.sts.filter(s=>s.type!=='portal').length+' สถานี</span><span class="chip">🚆 '+run+' / '+W.trains.length+' ขบวน</span>'+
 (wait?'<span class="chip" style="color:#ff6b78">🔴 รอสัญญาณ '+wait+'</span>':'')+(late?'<span class="chip" style="color:#fbbf24">⚠ ล่าช้า '+late+'</span>':'');}
$('spd').innerHTML=[1,5,10,25,60].map(v=>'<button class="sx'+(v===SIM.mul?' on':'')+'" data-v="'+v+'">'+v+'×</button>').join('');
$('spd').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;SIM.mul=+b.dataset.v;$('spd').querySelectorAll('.sx').forEach(x=>x.classList.toggle('on',x===b));});
function play(v){SIM.run=v;$('cPl').textContent=v?'⏸':'▶';}
$('cPl').onclick=()=>play(!SIM.run);
$('cBk').onclick=()=>setClock(SIM.t-300);$('cFw').onclick=()=>setClock(SIM.t+300);
$('cRs').onclick=()=>{resetSim();renderLeft();toast('เริ่มจำลองใหม่ที่ '+hm(SIM.t));};
$('cGo').onclick=()=>{const t=pT(val('cIn'));if(t==null){toast('รูปแบบเวลาไม่ถูกต้อง เช่น 05:30','er');return;}setClock(t);play(true);toast('ไปที่เวลา '+hm(t));};
$('cIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('cGo').click();});
window.addEventListener('keydown',e=>{if(/input|select|textarea/i.test(e.target.tagName))return;
 if(e.code==='Space'){e.preventDefault();play(!SIM.run);}
 if(e.key==='Escape'){UI.add=false;DR=null;cleanNodes();closeDlg();renderLeft();}});

/* ═════════ บันทึก / เปิด ═════════ */
function ser(){return{v:1,nodes:W.nodes,edges:W.edges.map(e=>({id:e.id,a:e.a,b:e.b,kind:e.kind,st:e.st,pf:e.pf,vmax:e.vmax})),sts:W.sts,
 trains:W.trains.map(t=>({id:t.id,no:t.no,color:t.color,stops:t.stops})),seq:W.seq};}
function loadObj(o){W={nodes:o.nodes||[],edges:o.edges||[],sts:o.sts||[],trains:[],seq:o.seq||1000};reindex();(o.trains||[]).forEach(t=>mkTrain(t));UI.sel=null;resetSim();fit();renderLeft();}
$('bSave').onclick=()=>{const b=new Blob([JSON.stringify(ser())],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='railflow.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);};
$('fIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{loadObj(JSON.parse(r.result));toast('เปิดไฟล์สำเร็จ');}catch(x){toast('ไฟล์ไม่ถูกต้อง','er');}};r.readAsText(f);e.target.value='';};
$('bFit').onclick=fit;$('bDemo').onclick=()=>{if(confirm('โหลดตัวอย่างทับของเดิม?'))demo();};

 E(1400,B,1460,420,{vmax:45});E(1460,420,1500,420,{vmax:60});E(1500,420,1700,420,{kind:'plat',st:TLC,pf:'1',vmax:60});E(1700,420,1740,420,{vmax:60});E(1740,420,1800,B,{vmax:45});
 E(1880,A,1940,B,{vmax:45});E(2000,B,2060,A,{vmax:45});
 E(2120,B,2180,420,{vmax:45});E(2180,420,2700,420,{vmax:90});E(2700,420,2760,480,{vmax:60});E(2760,480,2860,480,{vmax:90});
 E(2860,480,3000,480,{kind:'portal',st:SRJ,pf:'1',vmax:90});

 T('1003',RED,'05:12',[[SLY,'2'],[STS,'2'],[TLC,'4'],[BBR,'2'],[KTW,'2']]);
 T('1004',RED,'05:15',[[KTW,'1'],[BBR,'1'],[TLC,'2',1],[STS,'1'],[SLY,'1']]);
 T('2001',ORG,'05:22',[[SLY,'2'],[STS,'2'],[TLC,'3'],[SRJ,'1']]);
 T('2002',ORG,'05:28',[[SRJ,'1'],[TLC,'2'],[STS,'1'],[SLY,'1']]);
 T('1005',RED,'05:30',EB);T('1006',RED,'05:32',[[KTW,'1'],[BBR,'1'],[TLC,'1'],[STS,'1'],[SLY,'1']]);
 T('1101',RED,'05:36',[[SLY,'2'],[STS,'2'],[TLC,'4']]);
 T('3003',TEAL,'05:44',[[SRJ,'1'],[TLC,'1'],[SRJ,'1']]);
 T('1007',RED,'05:45',EB);T('1008',RED,'05:47',WB);
 UI.sel=null;UI.add=false;resetSim();fit();renderLeft();toast('โหลดตัวอย่าง: '+W.trains.length+' ขบวน · 3 สถานี · 3 ทางเข้า-ออก');}

/* ═════════ ลูปหลัก ═════════ */
let last=0,acc=0;
function loop(ts){const dt=Math.min(.1,(ts-(last||ts))/1000);last=ts;
 if(SIM.run){let s=dt*SIM.mul;while(s>1e-6){const h=Math.min(.25,s);tick(h);s-=h;}}
 $('ct').innerHTML=hm(SIM.t)+'<small>:'+p2(Math.floor(((SIM.t%60)+60)%60))+'</small>';
 draw();acc+=dt;
 if(acc>.8){acc=0;renderUpc();renderHud();
  const ae=document.activeElement;if(!LPH&&!(ae&&$('lp').contains(ae)&&/input|select/i.test(ae.tagName))&&UI.tab==='tr')renderLeft();
  try{localStorage.setItem('railflow_v1',JSON.stringify(ser()));}catch(e){}}
 requestAnimationFrame(loop);}
window.addEventListener('resize',resize);
resize();reindex();
(function boot(){let ok=false;try{const s=localStorage.getItem('railflow_v1');if(s){const o=JSON.parse(s);if(o.nodes&&o.nodes.length){loadObj(o);ok=true;}}}catch(e){}
 if(!ok)demo();})();
play(true);requestAnimationFrame(loop);
</script>
