<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulation Redline — OPS</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#03050a;--pn:#0d121a;--pn2:#141b25;--bd:#263040;--tx:#e8edf4;--mu:#8592a5;--rd:#c62f3a;--rd2:#e23d4a;--yl:#ffd84a;--gn:#34d399;--cy:#38bdf8}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:13px Sarabun,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
#err{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:#7f1d1d;color:#fff;padding:7px 12px;font:12px monospace}
.app{display:grid;grid-template-rows:46px 38px 1fr 58px;height:100vh}
.top{display:flex;align-items:center;gap:6px;padding:0 10px;background:#080b11;border-bottom:1px solid var(--bd);overflow-x:auto}
.logo{font:700 20px Rajdhani;letter-spacing:1px;white-space:nowrap}.logo b{color:var(--rd2)}
.sp{flex:1}
.tb{background:var(--pn2);border:1px solid var(--bd);border-radius:8px;padding:5px 9px;cursor:pointer;white-space:nowrap;margin:0}
.tb:hover{border-color:var(--rd2)}
.tb.th{font-weight:700}
.svs{font-size:11px;color:#6ee7a0;white-space:nowrap}
@media(max-width:1350px){.top .hint{display:none}}
.pbar{display:flex;align-items:flex-end;gap:3px;padding:0 8px;background:#05070b;border-bottom:1px solid #3a4658;overflow-x:auto;overflow-y:hidden}
.pj{display:flex;align-items:center;gap:7px;padding:6px 8px 7px 12px;background:#0b1018;border:1px solid var(--bd);border-bottom:0;border-radius:9px 9px 0 0;cursor:pointer;color:var(--mu);font-weight:700;font-size:12px;max-width:230px;white-space:nowrap;user-select:none}
.pj:hover{color:#fff}
.pj .nm{overflow:hidden;text-overflow:ellipsis}
.pj .tm{font-size:10px;color:#5f6b7c;font-weight:600}
.pj.on{background:var(--pn);color:#fff;border-color:#3a4658;box-shadow:inset 0 2px 0 var(--rd2);margin-bottom:-1px;padding-bottom:8px}
.pj.drg{opacity:.35}.pj.dl0{box-shadow:inset 4px 0 0 var(--yl)!important}.pj.dr0{box-shadow:inset -4px 0 0 var(--yl)!important}
.pj .xx{opacity:.45;border-radius:4px;padding:0 5px;font-size:13px}.pj .xx:hover{opacity:1;background:#5b1220}
.pjb{margin:0 0 5px 3px;padding:3px 10px;border:1px solid var(--bd);background:#0b1018;border-radius:7px;cursor:pointer;font-weight:700;color:var(--mu);white-space:nowrap}
.pjb:hover{color:#fff;border-color:var(--rd2)}
.main{display:grid;grid-template-columns:400px 1fr;min-height:0}
.left{background:var(--pn);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--bd)}
.tab{flex:1;padding:10px;border:0;background:none;cursor:pointer;color:var(--mu);font-weight:700;border-bottom:2px solid transparent}
.tab.on{color:var(--tx);border-bottom-color:var(--rd2)}
#lp{flex:1;overflow:auto;padding:10px}
.stage{position:relative;min-width:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hudc{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:none}
.chip{background:rgba(12,17,25,.92);border:1px solid var(--bd);border-radius:7px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.banner{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:#6d1420;border:1px solid var(--rd2);color:#fff;padding:7px 16px;border-radius:9px;font-weight:700;display:none;white-space:nowrap}
.clock{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(9,13,20,.95);border:1px solid #2f3a4b;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.crow{display:flex;gap:6px;align-items:center}
.cb{width:36px;height:34px;border:1px solid #3a4658;background:#121924;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px}
.cb:hover{border-color:var(--yl)}
.cb.go{background:#14532d;border-color:#22c55e;color:#fff;animation:pls 1.4s infinite}
@keyframes pls{50%{box-shadow:0 0 0 5px rgba(34,197,94,.25)}}
.ctime{font:700 32px Rajdhani;letter-spacing:1px;min-width:140px;text-align:center}
.ctime small{font-size:16px;color:var(--mu)}
.sx{padding:3px 8px;border:1px solid #3a4658;background:#121924;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;margin-right:2px}
.sx.on{background:var(--yl);color:#111;border-color:var(--yl)}
.sx.v.on{background:#a78bfa;border-color:#a78bfa;color:#fff}
.tin{width:62px;padding:4px;border:1px solid #3a4658;background:#0b1018;border-radius:6px;text-align:center}
.upc{display:flex;align-items:center;gap:14px;padding:0 14px;background:#080b11;border-top:1px solid var(--bd);overflow-x:auto}
.upt{font-weight:700;color:#ffd84a;font-size:11px;white-space:nowrap}
#upl{display:flex;gap:12px}
.uc{display:flex;flex-direction:column;gap:3px;cursor:pointer;white-space:nowrap}
.uc .a{font-size:11px;font-weight:700}.uc .b{font-size:10px;border-radius:4px;padding:1px 7px;font-weight:700;color:#fff}
.sec{border:1px solid var(--bd);border-radius:10px;padding:9px;margin-bottom:9px;background:var(--pn2)}
.sec h4{margin:0 0 7px;font-size:12px;color:#ff8a94}
.dws{border-color:#1d4a63;background:#0c1822}.dws h4{color:#7cd4ff}
.ghs{border-color:#3d2a5c;background:#140f1f}.ghs h4{color:#c4b5fd}
.bt{padding:6px 10px;border:1px solid var(--bd);background:#0b1018;border-radius:8px;cursor:pointer;font-weight:700;font-size:12px}
.bt:hover{border-color:var(--rd2)}.bt.p{background:var(--rd);border-color:var(--rd);color:#fff}
.bt.on{background:var(--yl);color:#111;border-color:var(--yl)}.bt.d{color:#ff8a8a}.bt.w{width:100%;margin-top:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hint{font-size:11px;color:var(--mu);line-height:1.65}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{padding:9px;border:1px solid var(--bd);background:#0b1018;border-radius:9px;cursor:pointer;text-align:left;font-weight:700}
.tool.on{border-color:var(--yl);background:#231d0a;color:var(--yl)}
.srow{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.srow input{flex:1;padding:4px 7px;border:1px solid var(--bd);border-radius:6px;background:#0b1018}
.pill{font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;background:#273040;color:#9fb0c4;white-space:nowrap}
.x{border:0;background:none;color:#6b7684;cursor:pointer}.x:hover{color:#f87171}
.trow{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--bd);border-radius:9px;margin-bottom:6px;background:#0b1018;cursor:pointer}
.trow:hover{border-color:#4a5568}
.trow .bar{width:5px;align-self:stretch;border-radius:3px}
.trow .no{font:700 19px Rajdhani;min-width:48px}
.trow .rt{flex:1;min-width:0}.trow .rt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .st{font-size:11px;font-weight:700}
.vck{width:22px;height:22px;border:2px solid var(--c);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;cursor:pointer;color:#fff}
.vck.on{background:var(--c)}
.vck:hover{box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.gc{display:flex;align-items:center;gap:2px;font-size:11px;font-weight:700;flex:none;white-space:nowrap}
.gc button{width:19px;height:19px;padding:0;border:1px solid var(--bd);background:#121924;border-radius:4px;cursor:pointer;font-size:11px;line-height:1}
.gc button:hover{border-color:#a78bfa}
.dl{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:#3a2a08;color:#fbbf24}
.eh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.eh input.no{width:90px;font:700 21px Rajdhani;background:#0b1018;border:1px solid var(--bd);border-radius:7px;padding:1px 8px}
input[type=color]{width:34px;height:30px;border:1px solid var(--bd);border-radius:7px;background:#0b1018;padding:2px;cursor:pointer}
.card{border:1px solid #4a1a21;border-radius:8px;margin-bottom:8px;overflow:hidden;background:#0a0d13}
.ch{display:flex;align-items:center;gap:4px;background:linear-gradient(90deg,#b8222f,#931b26);padding:5px 6px;color:#fff}
.ch .ix{font:700 21px Rajdhani;min-width:18px;text-align:center}
.ch .nm{font:700 15px Rajdhani;letter-spacing:.5px;max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-transform:uppercase}
.ch .ic{font-size:11px;opacity:.85;margin-left:2px}
.pfb{min-width:25px;height:25px;border:1px solid #3c1218;background:#1a0f12;color:#fff;border-radius:5px;cursor:pointer;font-weight:700;font-size:12px;padding:0 4px}
.pfb:hover{border-color:#ff9aa3}
.pfb.on{border-color:var(--yl);color:var(--yl);background:#2a1d0c}
.pfb.au{border-style:dashed;border-color:#b59a2e;color:#d9c06a}
.cbd{display:grid;grid-template-columns:1fr 134px;gap:7px;padding:6px}
.mt{position:relative;background:#06090e;border-radius:5px;overflow:hidden}
.mt .tk{position:absolute;top:1px;font-size:9px;color:#8592a5;transform:translateX(-50%)}
.mt .tk.c{background:#e8edf4;color:#111;border-radius:4px;padding:0 3px;font-weight:700}
.mt .rw{position:absolute;left:0;right:0;height:8px;background:rgba(255,255,255,.045)}
.mt .rl{position:absolute;left:2px;font-size:8px;color:#8592a5;line-height:8px}
.mt .bb{position:absolute;height:7px;border-radius:4px}
.mt .nw{position:absolute;top:13px;bottom:0;width:1.5px;background:#fff}
.mt .band{position:absolute;top:13px;bottom:0;width:8px;background:rgba(255,216,74,.2);border-left:1px solid rgba(255,216,74,.7);border-right:1px solid rgba(255,216,74,.7)}
.tm label{display:block;font-size:10.5px;color:var(--mu);text-align:center;font-weight:700;margin-top:1px}
.tm label.dwl{color:#7cd4ff}
.tmr{display:flex;align-items:center;gap:3px;justify-content:center}
.pm{width:22px;height:22px;border:1px solid #3a4658;background:#121924;border-radius:5px;cursor:pointer;font-weight:700;padding:0;flex:none}
.ti{width:68px;text-align:center;border:1px solid transparent;background:transparent;font-weight:700;font-size:13px;border-radius:4px}
.ti.dw{color:#bfe9ff;background:#0c1822;border-color:#1d4a63}
.ti:focus{outline:none;border-color:var(--yl);background:#0b1018}
.act{font-size:10px;color:#ff9ed2;text-align:center;margin-top:3px}
.cf{display:flex;gap:4px;justify-content:center;margin-top:5px}
.mini{font-size:10px;padding:2px 6px;border:1px solid #3a4658;background:#121924;border-radius:5px;cursor:pointer}
.mini.on{border-color:#7cb4ff;color:#7cb4ff}
.err2{background:#3b1117;border:1px solid #7f1d1d;color:#ffb4b4;border-radius:8px;padding:6px 9px;margin-bottom:8px;font-size:12px}
.pop{position:absolute;z-index:40;min-width:220px;background:rgba(13,18,26,.97);border:1px solid #3a4658;border-radius:11px;padding:5px;box-shadow:0 14px 34px rgba(0,0,0,.55);display:none}
.pop .ph{padding:5px 10px 6px;font-size:11px;color:var(--mu);font-weight:700;border-bottom:1px solid var(--bd);margin-bottom:4px;white-space:nowrap}
.pop .pi{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.pop .pi:hover{background:var(--rd);color:#fff}
.pop .pi.dz:hover{background:#b91c1c}
.pop .pi.off{opacity:.35;pointer-events:none}
.pop .pi span{width:18px;text-align:center}
.pop .pi small{margin-left:auto;padding-left:14px;color:var(--mu);font-size:10px}
.pop .pi:hover small{color:#fff}
.pop .ps{height:1px;background:var(--bd);margin:4px 6px}
#mask{position:fixed;inset:0;background:rgba(3,5,9,.7);display:none;z-index:500;align-items:center;justify-content:center;padding:18px}
#mask.on{display:flex}
.dlg{background:var(--pn);border:1px solid #3a4553;border-radius:14px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dlg h3{margin:0;padding:13px 16px;border-bottom:1px solid var(--bd);font-size:14px}
.dlg .db{padding:14px 16px}
.dlg .df{padding:11px 16px;border-top:1px solid var(--bd);display:flex;gap:7px;justify-content:flex-end}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.f label{font-size:11px;color:var(--mu);font-weight:700}
.f input,.f select{padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:#0b1018}
#toast{position:fixed;right:16px;bottom:70px;display:flex;flex-direction:column;gap:6px;z-index:600}
.ts{background:#064e30;border:1px solid #0d7a4c;color:#fff;padding:8px 12px;border-radius:9px;font-size:12px}
.ts.er{background:#5b1220;border-color:#912036}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2c3642;border-radius:8px;border:2px solid var(--pn)}
/* ── ตารางเดินรถ ── */
.stage.tton>canvas#cv,.stage.tton>.hudc,.stage.tton>.banner,.stage.tton>.clock,.stage.tton>.pop{display:none!important}
.ttv{display:none;position:absolute;inset:0;flex-direction:column;background:var(--bg)}
.stage.tton .ttv{display:flex}
.main.nopanel{grid-template-columns:0 1fr}.main.nopanel .left{display:none}
.ttbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 7px;padding:7px 10px;background:var(--pn);border-bottom:1px solid var(--bd);flex:none}
.tg{display:flex;align-items:center;gap:3px;padding:3px 5px 3px 9px;border:1px solid var(--bd);border-radius:13px;background:var(--pn2);white-space:nowrap;flex:none}
.tg>span{font-size:10.5px;color:var(--mu);font-weight:700;margin-right:3px}
.tg b{font:700 21px Rajdhani;letter-spacing:.5px;min-width:84px;text-align:center}
.tbn{padding:4px 10px;border:1px solid var(--bd);background:var(--pn);border-radius:10px;cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap;color:var(--tx)}
.tbn:hover{border-color:var(--rd2)}
.tbn.on{background:var(--yl);color:#111;border-color:var(--yl)}
.tbn.warn{background:var(--rd);border-color:var(--rd);color:#fff}
.tbn.go{background:#14532d;border-color:#22c55e;color:#fff;animation:pls 1.4s infinite}
.ttcw{position:relative;flex:1;min-height:0}
.ttcw canvas{position:absolute;inset:0;cursor:grab}
.ttcw .banner{top:12px}
.ttd{border:1px solid var(--bd);border-radius:12px;margin-bottom:9px;background:var(--pn2);overflow:hidden}
.ttd>summary{cursor:pointer;padding:9px 12px;font-weight:700;font-size:12.5px;list-style:none;display:flex;align-items:center;gap:7px;user-select:none}
.ttd>summary::-webkit-details-marker{display:none}
.ttd>summary::after{content:'›';margin-left:auto;color:var(--mu);font-size:17px;transition:transform .15s}
.ttd[open]>summary::after{transform:rotate(90deg)}
.ttb2{padding:2px 10px 10px}
.cfi{border:1px solid #7f1d1d;background:rgba(220,38,38,.1);border-radius:10px;padding:6px 9px;margin-bottom:6px;cursor:pointer;font-size:11.5px}
.cfi:hover{border-color:#ff4b5c}.cfi b{color:#ff6b78}.cfi div{color:var(--mu);margin-top:1px}
.okb{border:1px solid #14532d;background:rgba(34,197,94,.1);color:#4ade80;border-radius:10px;padding:8px 10px;font-weight:700}
.ttr{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--bd);border-radius:10px;margin-bottom:5px;background:var(--pn);cursor:pointer}
.ttr.on{border-color:var(--yl);box-shadow:0 0 0 1px var(--yl) inset}
.ttr .cb2{width:9px;height:18px;border-radius:5px;flex:none}
.ttr .rt2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:var(--mu)}
.ttr small{color:var(--mu);font-size:10px;white-space:nowrap}
.cfd{background:#dc2626;color:#fff;border-radius:99px;width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;animation:blk 1s infinite}
@keyframes blk{50%{opacity:.25}}
.vk{width:20px;height:20px;border:2px solid var(--mu);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.vk.on{background:#22c55e;border-color:#22c55e}
.tfi{flex:1;min-width:100px;padding:6px 10px;border:1px solid var(--bd);border-radius:99px;background:var(--pn)}
.strow{display:flex;align-items:center;gap:5px;padding:4px 6px;border:1px solid var(--bd);border-radius:10px;margin-bottom:4px;background:var(--pn)}
.strow .sn{flex:1;min-width:0;cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strow .sn small{color:var(--mu);font-weight:600}
.strow .gi{width:54px;padding:3px 5px;border:1px solid var(--bd);border-radius:7px;background:var(--pn2);text-align:right}
.strow .gi0{width:54px;flex:none}
.strow small{color:var(--mu);font-size:10px}
.x2{width:22px;height:22px;border:1px solid var(--bd);background:var(--pn2);border-radius:6px;cursor:pointer;padding:0;font-size:10px;color:var(--tx)}
.ett{max-height:56vh;overflow:auto;border:1px solid var(--bd);border-radius:10px}
.ett table{width:100%;border-collapse:collapse;font-size:12px}
.ett th{position:sticky;top:0;background:var(--pn2);padding:6px 8px;text-align:left;font-size:10.5px;color:var(--mu);z-index:1}
.ett td{padding:4px 8px;border-top:1px solid var(--bd)}
.ett td.c{text-align:center}.ett td.nm{font-weight:700;white-space:nowrap}
.ett input:not([type=checkbox]),.ett select{width:84px;padding:4px 6px;border:1px solid var(--bd);border-radius:7px;background:var(--pn2)}
.ett select{width:128px}
.mu{color:var(--mu)}
.tab{padding:10px 4px;font-size:12px}
body.light .tbn,body.light .tfi,body.light .strow,body.light .ttr{background:#fff}
body.light .tbn.on{background:var(--yl)}body.light .tbn.warn{background:var(--rd)}body.light .tbn.go{background:#14532d}
body.light .cfi b{color:#c2182b}body.light .okb{color:#0f7a4a}
/* ── โหมดสว่าง ── */
body.light{--bg:#e9eef5;--pn:#ffffff;--pn2:#f4f6fa;--bd:#d2d9e4;--tx:#18202b;--mu:#5d6b7e}
body.light .top,body.light .upc{background:#fff}
body.light .pbar{background:#e3e9f1;border-bottom-color:#c8d0dc}
body.light .pj{background:#eef2f7;color:#5d6b7e}body.light .pj:hover{color:#111}
body.light .pj.on{background:#fff;color:#111;border-color:#c8d0dc}
body.light .bt,body.light .tool,body.light .trow,body.light .srow input,body.light .f input,body.light .f select,body.light input[type=color],body.light .eh input.no,body.light .tin,body.light .pjb,body.light .tb{background:#fff}
body.light .pjb:hover{color:#111}
body.light .tool.on{background:#fff6d6;color:#8a6a00;border-color:#e0b400}
body.light .bt.p{background:var(--rd);color:#fff}body.light .bt.on{background:var(--yl);color:#111}
body.light .cb,body.light .sx,body.light .pm,body.light .mini,body.light .gc button{background:#f1f4f8;border-color:#c8d0dc}
body.light .sx.on{background:var(--yl);color:#111}body.light .sx.v.on{background:#a78bfa;color:#fff}
body.light .clock{background:rgba(255,255,255,.96);border-color:#c8d0dc;box-shadow:0 10px 30px rgba(0,0,0,.15)}
body.light .chip{background:rgba(255,255,255,.95)}
body.light .card{background:#fff;border-color:#e2b5ba}
body.light .mt{background:#eef2f7}body.light .mt .rw{background:rgba(0,0,0,.05)}body.light .mt .nw{background:#111}
body.light .mt .tk.c{background:#18202b;color:#fff}

<script>
"use strict";
window.addEventListener('error',e=>{const b=document.getElementById('err');b.style.display='block';b.textContent='⚠ '+e.message+' [บรรทัด '+e.lineno+']';});
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const D2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,f)=>({x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val=id=>{const e=$(id);return e?e.value:'';};
function hm(t){if(t==null||isNaN(t))return'--:--';t=Math.round(t);t=((t%86400)+86400)%86400;return p2(Math.floor(t/3600))+':'+p2(Math.floor(t%3600/60));}
function hms(t){t=Math.round(t);t=((t%86400)+86400)%86400;return p2(Math.floor(t/3600))+':'+p2(Math.floor(t%3600/60))+':'+p2(t%60);}
function hmx(t){if(t==null||isNaN(t))return'--:--';return(((Math.round(t)%60)+60)%60)?hms(t):hm(t);}
function pT(s){const m=String(s||'').trim().match(/^(\d{1,2})[:.]?(\d{2})(?:[:.](\d{2}))?$/);if(!m||+m[2]>59)return null;return +m[1]*3600+ +m[2]*60+(m[3]?+m[3]:0);}
function pMS(s){s=String(s||'').trim();let m=s.match(/^(\d{1,3})[:.](\d{1,2})$/);if(m)return +m[1]*60+ +m[2];if(/^\d+$/.test(s))return +s;return null;}
function mmss(s){const n=s<0;s=Math.abs(Math.round(s||0));return(n?'-':'')+p2(Math.floor(s/60))+':'+p2(s%60);}
function toast(m,k){const d=document.createElement('div');d.className='ts '+(k||'');d.textContent=m;$('toast').appendChild(d);setTimeout(()=>d.remove(),2800);}
function shade(h,a){let n=parseInt(String(h).slice(1),16);if(isNaN(n))n=0xd42a37;const f=c=>Math.round(a>0?c+(255-c)*a:c*(1+a));return'rgb('+f(n>>16)+','+f(n>>8&255)+','+f(n&255)+')';}

/* ═════════ ธีม มืด / สว่าง ═════════ */
const THS={
 dark:{bg:'#03050a',glow:'rgba(22,44,92,.42)',grid:'rgba(120,140,170,.07)',rail:'rgba(214,220,229,.9)',railP:'rgba(205,212,222,.55)',txt:'#ffffff',sh:'rgba(0,0,0,.6)',mu:'#8592a5',sig:'#aeb7c4',lb:'rgba(6,9,14,.82)',lt:'#e8edf4',node:'#5c6b80'},
 light:{bg:'#e8edf4',glow:'rgba(120,150,210,.28)',grid:'rgba(60,80,110,.09)',rail:'rgba(38,48,64,.88)',railP:'rgba(38,48,64,.45)',txt:'#111827',sh:'rgba(255,255,255,.8)',mu:'#5d6b7e',sig:'#7b8798',lb:'rgba(255,255,255,.93)',lt:'#111827',node:'#8a96a8'}};
let THM='dark',TC=THS.dark;
function setTheme(m){THM=m==='light'?'light':'dark';TC=THS[THM];document.body.classList.toggle('light',THM==='light');
 $('bTheme').textContent=THM==='dark'?'☀️ โหมดสว่าง':'🌙 โหมดมืด';try{localStorage.setItem('redline_theme',THM);}catch(e){}}
$('bTheme').onclick=()=>setTheme(THM==='dark'?'light':'dark');

/* ═════════ ค่าคงที่ ═════════ */
const PXM=2,NCAR=4,CAR=21,GAP=1.8,TL=NCAR*CAR+(NCAR-1)*GAP,ACC=0.8/PXM,DEC=0.9/PXM,GRID=10;
const kp=k=>Math.max(5,k)/3.6/PXM;
const tt=(px,v)=>px*PXM/(Math.max(10,v)/3.6*0.88);

/* ═════════ โลก ═════════ */
let W={nodes:[],edges:[],sts:[],trains:[],xing:[],seq:1};
let NM={},EM={},SM={},ADJ={},NETV=1,RES={},TRM={},CX=[],XK={};
const SIM={t:18000,run:false,mul:10};
const UI={tab:'tr',sel:null,add:false,tool:'track',cas:true};
const MV={sel:new Set(),drag:null,box:null};
const GH={on:true,spd:1,def:2,ph:0};
try{const g=JSON.parse(localStorage.getItem('redline_ghost')||'{}');['on','spd','def'].forEach(k=>{if(g[k]!=null)GH[k]=g[k];});}catch(e){}
function ghSave(){try{localStorage.setItem('redline_ghost',JSON.stringify({on:GH.on,spd:GH.spd,def:GH.def}));}catch(e){}}
let CB=null,MW=null,SD=null;
const nid=p=>p+(W.seq++);
function reindex(){NM={};EM={};SM={};ADJ={};
 if(!W.xing)W.xing=[];
 W.nodes.forEach(n=>{NM[n.id]=n;ADJ[n.id]=[];});W.sts.forEach(s=>SM[s.id]=s);
 W.edges=W.edges.filter(e=>NM[e.a]&&NM[e.b]&&e.a!==e.b);
 W.edges.forEach(e=>{e.len=D2(NM[e.a],NM[e.b])||0.01;EM[e.id]=e;ADJ[e.a].push(e.id);ADJ[e.b].push(e.id);});calcCross();NETV++;}
const oth=(E,n)=>E.a===n?E.b:E.a;
const stName=id=>SM[id]?SM[id].name:'?';
const stCode=id=>SM[id]?SM[id].code:'?';
const TR=id=>W.trains.find(t=>t.id===id);
function addNode(x,y){const n={id:nid('n'),x,y};W.nodes.push(n);NM[n.id]=n;ADJ[n.id]=[];return n;}
function addEdge(a,b,o){if(!a||!b||a===b)return null;for(const e of W.edges)if((e.a===a&&e.b===b)||(e.a===b&&e.b===a))return e;
 const e=Object.assign({id:nid('e'),a,b,kind:'track',st:null,pf:'',vmax:100},o||{});W.edges.push(e);reindex();return e;}
function cleanNodes(){W.nodes=W.nodes.filter(n=>W.edges.some(e=>e.a===n.id||e.b===n.id));reindex();}
function delEdge(id){W.edges=W.edges.filter(e=>e.id!==id);cleanNodes();}
function splitEdge(E,x,y){const n=addNode(Math.round(x),Math.round(y)),o={kind:E.kind,st:E.st,pf:E.pf,vmax:E.vmax};
 W.edges=W.edges.filter(q=>q.id!==E.id);reindex();addEdge(E.a,n.id,o);addEdge(n.id,E.b,o);return n;}
function mergeNode(a,b){W.edges.forEach(e=>{if(e.a===a)e.a=b;if(e.b===a)e.b=b;});const seen={};
 W.edges=W.edges.filter(e=>{if(e.a===e.b)return false;const k=[e.a,e.b].sort().join('|');if(seen[k])return false;seen[k]=1;return true;});
 W.nodes=W.nodes.filter(n=>n.id!==a);reindex();}
function outerN(E){return(ADJ[E.a]||[]).length<=1?E.a:E.b;}
const deadEnd=e=>(ADJ[e.a]||[]).length===1||(ADJ[e.b]||[]).length===1;
function nodeNear(x,y,r,ex){let b=null,bd=r;for(const n of W.nodes){if(n.id===ex)continue;const d=Math.hypot(n.x-x,n.y-y);if(d<bd){bd=d;b=n;}}return b;}
function edgeNear(x,y,r,ex){let best=null,bd=r;for(const e of W.edges){if(ex&&(e.a===ex||e.b===ex))continue;const A=NM[e.a],B=NM[e.b],vx=B.x-A.x,vy=B.y-A.y,L2=vx*vx+vy*vy;if(!L2)continue;
 const t=Math.max(0,Math.min(1,((x-A.x)*vx+(y-A.y)*vy)/L2)),px=A.x+vx*t,py=A.y+vy*t,d=Math.hypot(px-x,py-y);if(d<bd){bd=d;best={e,x:px,y:py,t};}}return best;}
function stEdges(sp){let a=W.edges.filter(e=>(e.kind==='plat'||e.kind==='portal')&&e.st===sp.st);
 if(sp.pf){const b=a.filter(e=>String(e.pf)===String(sp.pf));if(b.length)a=b;}return a;}
function tset(sp){const T={};stEdges(sp).forEach(e=>T[e.id]=1);return T;}
function onDist(E){return Math.max(Math.min(TL+2,E.len-2),Math.min(E.len-2,E.len/2+TL/2));}
function cumOf(P){const C=[0];for(let i=1;i<P.length;i++)C.push(C[i-1]+D2(P[i-1],P[i]));return C;}
function atP(P,C,d){if(d<=0)return P[0];const n=C.length-1;if(d>=C[n])return P[n];let lo=0,hi=n;
 while(hi-lo>1){const m=(lo+hi)>>1;if(C[m]<=d)lo=m;else hi=m;}const s=C[hi]-C[lo];return s>0?lerp(P[lo],P[hi],(d-C[lo])/s):P[lo];}
const at=(r,d)=>atP(r.pts,r.cum,d);
function sliceP(P,C,a,b){const o=[atP(P,C,a)];for(let i=0;i<P.length;i++)if(C[i]>a&&C[i]<b)o.push(P[i]);o.push(atP(P,C,b));return o;}
const lenOf=P=>{let s=0;for(let i=1;i<P.length;i++)s+=D2(P[i-1],P[i]);return s;};
const mid=e=>lerp(NM[e.a],NM[e.b],.5);
function nextPf(st,kind){let m=0;W.edges.forEach(e=>{if(e.st===st&&e.kind===kind){const v=parseInt(e.pf);if(!isNaN(v)&&v>m)m=v;}});return m+1;}
function kindName(e){return{track:'🛤 รางวิ่ง',plat:'🚉 ชานชาลา '+e.pf+' · '+stCode(e.st),portal:'🚪 ทางเข้า-ออก '+stName(e.st),buffer:'⛔ ทางตัน'}[e.kind]||e.kind;}

/* ═════════ จุดตัดราง (ทางตัดระดับ / สะพาน / อุโมงค์) ═════════ */
function segX(A,B,C,D){const rx=B.x-A.x,ry=B.y-A.y,sx=D.x-C.x,sy=D.y-C.y,den=rx*sy-ry*sx;if(Math.abs(den)<1e-9)return null;
 const qx=C.x-A.x,qy=C.y-A.y,t=(qx*sy-qy*sx)/den,u=(qx*ry-qy*rx)/den,E=1e-6;if(t<-E||t>1+E||u<-E||u>1+E)return null;return{t,u,x:A.x+rx*t,y:A.y+ry*t};}
function eAng(e){const A=NM[e.a],B=NM[e.b];return Math.atan2(B.y-A.y,B.x-A.x);}
function angD(a,b){let d=Math.abs(a-b)%Math.PI;return Math.min(d,Math.PI-d);}
function calcCross(){CX=[];XK={};const E=W.edges,X=W.xing||[];
 for(let i=0;i<E.length;i++)for(let j=i+1;j<E.length;j++){const a=E[i],b=E[j];
  if(a.a===b.a||a.a===b.b||a.b===b.a||a.b===b.b)continue;
  const p=segX(NM[a.a],NM[a.b],NM[b.a],NM[b.b]);if(!p)continue;
  let rec=null,bd=10;for(const x of X){const d=Math.hypot(x.x-p.x,x.y-p.y);if(d<bd){bd=d;rec=x;}}
  const type=rec?rec.type:'bridge';let nw=b;if(rec&&rec.ang!=null)nw=angD(eAng(a),rec.ang)<angD(eAng(b),rec.ang)?a:b;
  const k=CX.length;CX.push({x:p.x,y:p.y,a:a.id,b:b.id,type,nw:nw.id,rec});
  if(type==='level'){(XK[a.id]=XK[a.id]||[]).push('x'+k);(XK[b.id]=XK[b.id]||[]).push('x'+k);}}}
function crossList(A,B,exA,exB){const out=[];for(const e of W.edges){if(e.a===exA||e.b===exA||(exB&&(e.a===exB||e.b===exB)))continue;
 const p=segX(A,B,NM[e.a],NM[e.b]);if(!p||p.t<0.01)continue;out.push({e:e.id,x:p.x,y:p.y,t:p.t});}return out.sort((a,b)=>a.t-b.t);}
function crossNear(w){let b=null,bd=9/V.z;for(const x of CX){const d=Math.hypot(x.x-w.x,x.y-w.y);if(d<bd){bd=d;b=x;}}return b;}
const XNM={level:'ทางตัดระดับเดียว',bridge:'สะพานข้าม',tunnel:'ลอดอุโมงค์'};
function setXType(x,t){if(x.rec)x.rec.type=t;else W.xing.push({x:Math.round(x.x),y:Math.round(x.y),type:t,ang:eAng(EM[x.nw])});netEdited();toast('จุดตัด → '+XNM[t]);}
function swapX(x){const o=x.nw===x.a?x.b:x.a,ang=eAng(EM[o]);if(x.rec)x.rec.ang=ang;else W.xing.push({x:Math.round(x.x),y:Math.round(x.y),type:x.type,ang});netEdited();toast('สลับรางบน / ล่างแล้ว');}
function xToSwitch(x){if(x.rec)W.xing=W.xing.filter(q=>q!==x.rec);const ea=EM[x.a];if(!ea)return;
 const n1=splitEdge(ea,x.x,x.y),en=edgeNear(x.x,x.y,3,n1.id);if(en){const n2=en.t<=.001?NM[en.e.a]:en.t>=.999?NM[en.e.b]:splitEdge(en.e,x.x,x.y);mergeNode(n2.id,n1.id);}
 netEdited();toast('แปลงจุดตัดเป็นประแจ ◆ แล้ว');}

/* ═════════ เวลาจอด ═════════ */
function dwOf(tr,i){const S=tr.stops,sp=S[i];if(!sp||sp.pass)return 0;if(sp.dw!=null)return sp.dw;
 return(i===S.length-1&&i>0)?(tr.dwEnd!=null?tr.dwEnd:90):(tr.dwStd!=null?tr.dwStd:30);}

/* ═════════ ค้นหาเส้นทาง ═════════ */
function hdg(E,from){const a=NM[from],b=NM[oth(E,from)];return Math.atan2(b.y-a.y,b.x-a.x);}
function angOK(i1,n,i2){const E1=EM[i1],E2=EM[i2];let d=Math.abs(hdg(E1,oth(E1,n))-hdg(E2,n));if(d>Math.PI)d=2*Math.PI-d;return d<=1.0;}
function route(starts,T,tid){
 const Q=[],seen={};let g=0;
 starts.forEach(s=>Q.push({e:s.e,x:s.x,c:s.c,s,par:null}));
 while(Q.length&&g++<20000){
  let bi=0;for(let i=1;i<Q.length;i++)if(Q[i].c<Q[bi].c)bi=i;
  const q=Q.splice(bi,1)[0];
  if(q.fin){const ch=[];let p=q.par;while(p.par){ch.unshift({e:p.e,exit:p.x});p=p.par;}return{s:p.s,chain:ch,tgt:{e:q.e,entry:q.par.x}};}
  const k=q.e+'>'+q.x;if(seen[k])continue;seen[k]=1;
  for(const e2 of ADJ[q.x]||[]){if(e2===q.e||!angOK(q.e,q.x,e2))continue;const E=EM[e2];let pen=0;
   if(tid){const r=RES['e'+e2];if(r&&r!==tid)pen+=3000;const rn=RES['n'+q.x];if(rn&&rn!==tid)pen+=1500;}
   if(T[e2])Q.push({fin:1,e:e2,c:q.c+E.len/2+pen,par:q});
   else Q.push({e:e2,x:oth(E,q.x),c:q.c+E.len+pen,par:q});}}
 return null;}
function spawnOpts(E){if(E.kind==='portal'){const O=outerN(E);return[{e:E.id,x:oth(E,O),c:0,p:{x:NM[O].x,y:NM[O].y}}];}

function askCross(pt,xs,tg,first){const S=w2s(pt);

  {ic:'◆',t:'เชื่อมเป็นประแจ',f:()=>go('switch')},
  {ic:'✕',t:'ทางตัดผ่านระดับเดียว (ไม่เชื่อม)',f:()=>go('level')},
  {ic:'🌉',t:'สะพานข้ามด้านบน (ไม่เชื่อม)',f:()=>go('bridge')},
  {ic:'🚇',t:'ลอดอุโมงค์ด้านล่าง (ไม่เชื่อม)',f:()=>go('tunnel')},
  {sep:1},{ic:'✖',t:'ยกเลิก',f:()=>{}}]);}
function startOn(pt,c,m){let n;
 if(m==='switch'){const en=edgeNear(c.x,c.y,2);n=en?splitEdge(en.e,c.x,c.y):addNode(Math.round(pt.x),Math.round(pt.y));toast('สร้างประแจ ◆');}
 else{n=addNode(pt.x,pt.y);W.xing.push({x:Math.round(pt.x),y:Math.round(pt.y),type:m,ang:null});}
 reindex();DR={id:n.id,x:n.x,y:n.y,px:n.x,py:n.y};}
function commitSeg(pt,tg,xs,mode){if(!DR)return;const from=DR.id,ang=Math.atan2(pt.y-DR.y,pt.x-DR.x),chain=[];let end=null,ns=0;
 if(mode==='switch'){for(const c of xs){const en=edgeNear(c.x,c.y,2);if(!en)continue;
   const n=en.t<=.001?NM[en.e.a]:en.t>=.999?NM[en.e.b]:splitEdge(en.e,c.x,c.y);ns++;if(c.end)end=n.id;else chain.push(n.id);}}
 if(!end)end=tg?tg.id:addNode(pt.x,pt.y).id;
 let prev=from;for(const id of chain){if(id!==prev){addEdge(prev,id);prev=id;}}if(end!==prev)addEdge(prev,end);
 if(mode!=='switch'&&mode!=='none')xs.forEach(c=>W.xing.push({x:Math.round(c.x),y:Math.round(c.y),type:mode,ang}));
 W.xing.forEach(x=>{if(x.ang==null&&Math.hypot(x.x-DR.x,x.y-DR.y)<2)x.ang=ang;});
 const E=NM[end];DR={id:end,x:E.x,y:E.y,px:E.x,py:E.y};netEdited();
 if(mode==='switch'&&ns)toast('สร้างประแจ ◆ '+ns+' จุด');else if(mode!=='none')toast('สร้าง'+XNM[mode]+' '+xs.length+' จุด');}
function buildClick(w,mx,my){const T=UI.tool;
 if(T==='track'){const raw=DR?octi(DR.x,DR.y,w.x,w.y):{x:snapG(w.x),y:snapG(w.y)};
  const tg=nodeNear(raw.x,raw.y,12/V.z);let oe=null;
  if(!tg){const en=edgeNear(raw.x,raw.y,8/V.z);if(en&&en.t>.03&&en.t<.97)oe=en;}
  const pt=tg?{x:tg.x,y:tg.y}:(oe?{x:oe.x,y:oe.y}:raw);
  if(!DR){if(oe){askCross(pt,[{e:oe.e.id,x:oe.x,y:oe.y,t:1,end:1}],null,true);return;}
   const n=tg||addNode(pt.x,pt.y);DR={id:n.id,x:n.x,y:n.y,px:n.x,py:n.y};return;}
  if(tg&&tg.id===DR.id)return;
  const xs=crossList(DR,pt,DR.id,tg?tg.id:null).filter(c=>!oe||c.e!==oe.e.id);
  if(oe)xs.push({e:oe.e.id,x:oe.x,y:oe.y,t:1,end:1});
  if(xs.length)askCross(pt,xs,tg,false);else commitSeg(pt,tg,[],'none');return;}
 const en=edgeNear(w.x,w.y,10/V.z);
 if(T==='del'){if(en){delEdge(en.e.id);netEdited();}else{const n=nodeNear(w.x,w.y,10/V.z);if(n){W.edges=W.edges.filter(e=>e.a!==n.id&&e.b!==n.id);cleanNodes();netEdited();}}return;}

 if(!w)w=s2w(cw/2,ch/2);
 let cx=0,cy=0;CB.nodes.forEach(n=>{cx+=n.x;cy+=n.y;});cx/=CB.nodes.length;cy/=CB.nodes.length;
 const dx=snapG(w.x-cx),dy=snapG(w.y-cy),M={},SMAP={};
 CB.sts.forEach(s=>{if(CB.pj===PJ.act&&SM[s.id]){SMAP[s.id]=s.id;return;}
  const ex=W.sts.find(q=>q.name===s.name&&q.type===s.type);
  if(ex)SMAP[s.id]=ex.id;else{const ns=Object.assign({},s,{id:nid('s')});W.sts.push(ns);SMAP[s.id]=ns.id;}});
 reindex();
 CB.nodes.forEach(n=>{const m=addNode(n.x+dx,n.y+dy);M[n.id]=m.id;});
 CB.edges.forEach(e=>{const o={kind:e.kind,st:e.st?SMAP[e.st]||null:null,pf:e.pf,vmax:e.vmax};
  if((o.kind==='plat'||o.kind==='portal')&&o.st&&W.edges.some(q=>q.st===o.st&&q.kind===o.kind&&String(q.pf)===String(o.pf)))o.pf=String(nextPf(o.st,o.kind));
  if((o.kind==='plat'||o.kind==='portal')&&!o.st){o.kind='track';o.pf='';}
  W.edges.push(Object.assign({id:nid('e'),a:M[e.a],b:M[e.b]},o));});
 CB.xing.forEach(x=>W.xing.push({x:x.x+dx,y:x.y+dy,type:x.type,ang:x.ang}));
 reindex();MV.sel=new Set(Object.values(M));netEdited();
 toast('📥 วาง '+CB.edges.length+' ราง — ใช้ลูกศรหรือเครื่องมือ ✥ ย้าย เพื่อขยับ');}

function nextNo(){let m=1000;W.trains.forEach(t=>{const n=parseInt(t.no);if(!isNaN(n)&&n>m)m=n;});return m+1;}
function mkTrain(o){const t={id:o.id||nid('t'),no:String(o.no||nextNo()),color:o.color||'#d42a37',stops:o.stops||[],
 dwStd:o.dwStd!=null?o.dwStd:30,dwEnd:o.dwEnd!=null?o.dwEnd:90,show:!!o.show,gc:o.gc!=null?o.gc:null,next:o.next||null,tth:!!o.tth,ver:1,rt:null,done:false,rec:[]};W.trains.push(t);return t;}
function fixEnds(tr){const S=tr.stops;if(!S.length)return;const f=S[0];if(f.dep==null)f.dep=f.arr!=null?f.arr:Math.ceil(SIM.t/60)*60;f.arr=null;f.pass=false;
 if(S.length>1){const l=S[S.length-1];if(l.arr==null)l.arr=l.dep;l.dep=null;l.pass=false;}
 for(let i=1;i<S.length-1;i++){const s=S[i];if(s.arr==null)s.arr=s.dep;if(s.dep==null)s.dep=s.pass?s.arr:s.arr+dwOf(tr,i);}}
function addStop(tr,e){const S=tr.stops,sp={st:e.st,pf:String(e.pf||''),arr:null,dep:null,pass:false};
 if(!S.length){sp.dep=Math.ceil((SIM.t+120)/60)*60;S.push(sp);}
 else{const pr=S[S.length-1];if(S.length>1&&pr.dep==null)pr.dep=pr.arr+(pr.dw!=null?pr.dw:tr.dwStd);const base=pr.dep!=null?pr.dep:pr.arr;S.push(sp);tr.ver++;
  const sg=preview(tr).segs.find(s=>s.j===S.length-1);sp.arr=Math.ceil((base+(sg?sg.t:180))/60)*60;}
 tr.ver++;renderLeft();toast('เพิ่ม '+stName(e.st)+(e.pf?' · ชานชาลา '+e.pf:''));}
function autoTimes(tr){const S=tr.stops;if(S.length<2)return;tr.ver++;const pv=preview(tr);
 let t=S[0].dep!=null?S[0].dep:Math.ceil(SIM.t/60)*60;S[0].dep=t;S[0].arr=null;
 for(let j=1;j<S.length;j++){const sg=pv.segs.find(s=>s.j===j);t+=sg?sg.t:180;const sp=S[j];
  if(j===S.length-1){sp.arr=Math.ceil(t/60)*60;sp.dep=null;sp.pass=false;}
  else if(sp.pass){sp.arr=sp.dep=Math.round(t/60)*60;t=sp.arr;}
  else{sp.arr=Math.ceil(t/60)*60;sp.dep=sp.arr+dwOf(tr,j);t=sp.dep;}}tr.ver++;}
function adjT(tr,i,f,dv){const S=tr.stops,sp=S[i];if(!sp||sp[f]==null||!dv)return;
 if(UI.cas){for(let j=i;j<S.length;j++){const q=S[j];if(j===i){q[f]+=dv;if(f==='arr'&&q.dep!=null)q.dep+=dv;}else{if(q.arr!=null)q.arr+=dv;if(q.dep!=null)q.dep+=dv;}}}
 else sp[f]+=dv;
 if(sp.pass)sp.dep=sp.arr;if(sp.arr!=null&&sp.dep!=null&&sp.dep<sp.arr)sp.dep=sp.arr;
 if(i>0&&i<S.length-1&&!sp.pass&&sp.arr!=null&&sp.dep!=null)sp.dw=sp.dep-sp.arr;
 tr.ver++;renderLeft();}
function setDw(tr,i,v){const S=tr.stops,sp=S[i];if(!sp)return;v=Math.max(0,Math.min(3600,Math.round(v)));
 if(i>0&&i<S.length-1&&!sp.pass&&sp.arr!=null){const nd=sp.arr+v,dv=nd-(sp.dep!=null?sp.dep:nd);sp.dw=v;sp.dep=nd;
  if(UI.cas&&dv)for(let j=i+1;j<S.length;j++){const q=S[j];if(q.arr!=null)q.arr+=dv;if(q.dep!=null)q.dep+=dv;}}
 else sp.dw=v;tr.ver++;renderLeft();}
function dwApply(tr){const S=tr.stops;S.forEach((sp,i)=>{if(sp.pass)return;sp.dw=(i===S.length-1&&i>0)?tr.dwEnd:tr.dwStd;});autoTimes(tr);}

let IDBP=null;

async function idbPut(k,v){try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}}
async function idbGet(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);});}catch(e){return null;}}

/* ── สถานี: ลำดับ / ระยะทาง จากผังรางอัตโนมัติ ── */
function stX(id){let s=0,n=0;W.edges.forEach(e=>{if(e.st===id&&NM[e.a]&&NM[e.b]){s+=NM[e.a].x+NM[e.b].x;n+=2;}});return n?s/n:0;}
function stSrc(sid){const m={};W.edges.forEach(e=>{if((e.kind==='plat'||e.kind==='portal')&&e.st===sid){const h=e.len/2;[e.a,e.b].forEach(n=>{if(m[n]==null||m[n]>h)m[n]=h;});}});return m;}
function dijk(src){const D={},done={},Q=[];for(const n in src){D[n]=src[n];Q.push(n);}
 while(Q.length){let bi=0;for(let i=1;i<Q.length;i++)if(D[Q[i]]<D[Q[bi]])bi=i;const n=Q.splice(bi,1)[0];if(done[n])continue;done[n]=1;
  for(const eid of ADJ[n]||[]){const E=EM[eid],m2=oth(E,n),d=D[n]+E.len;if(D[m2]==null||d<D[m2]){D[m2]=d;Q.push(m2);}}}return D;}
function ttDM(){const ids=W.sts.map(s=>s.id),k=NETV+':'+ids.join(',')+':'+W.edges.length;if(TT.dm&&TT.dmK===k)return TT.dm;
 const src={},d={},prs=[],nb={},tree={};ids.forEach(id=>{src[id]=stSrc(id);nb[id]=[];});
 ids.forEach((a,i)=>{if(!Object.keys(src[a]).length)return;const D=dijk(src[a]);
  for(let j=i+1;j<ids.length;j++){const b=ids[j],sb=src[b];let best=Infinity;for(const n in sb){if(D[n]!=null&&D[n]+sb[n]<best)best=D[n]+sb[n];}
   if(best<Infinity){const km=best*PXM/1000;d[a+'|'+b]=km;d[b+'|'+a]=km;prs.push({a,b,d:km});}}});
 prs.sort((x,y)=>x.d-y.d);const par={};ids.forEach(id=>par[id]=id);const fd=x=>par[x]===x?x:(par[x]=fd(par[x]));
 prs.forEach(p=>{const ra=fd(p.a),rb=fd(p.b);if(ra===rb)return;par[ra]=rb;nb[p.a].push({id:p.b,d:p.d});nb[p.b].push({id:p.a,d:p.d});tree[p.a+'|'+p.b]=tree[p.b+'|'+p.a]=true;});
 TT.dmK=k;return TT.dm={d,nb,tree};}
function ttAutoOrder(){const dm=ttDM(),ids=W.sts.map(s=>s.id);if(!ids.length)return[];
 const seen=new Set(),comps=[],out=[];
 ids.forEach(id=>{if(seen.has(id))return;const comp=[],st=[id];seen.add(id);while(st.length){const n=st.pop();comp.push(n);(dm.nb[n]||[]).forEach(o=>{if(!seen.has(o.id)){seen.add(o.id);st.push(o.id);}});}comps.push(comp);});
 comps.sort((a,b)=>b.length-a.length);
 const bfs=s=>{const D={[s]:0},P={},Q=[s];let best=s;while(Q.length){const n=Q.shift();(dm.nb[n]||[]).forEach(o=>{if(D[o.id]==null){D[o.id]=D[n]+o.d;P[o.id]=n;Q.push(o.id);if(D[o.id]>D[best])best=o.id;}});}return{best,P};};
 comps.forEach(comp=>{const a=bfs(comp[0]).best,r=bfs(a),path=[];let n=r.best;path.push(n);while(n!==a){n=r.P[n];path.push(n);}
  if(stX(path[0])>stX(path[path.length-1]))path.reverse();
  const vis=new Set(path),srt=n=>(dm.nb[n]||[]).slice().sort((x,y)=>x.d-y.d);
  const dfs=n=>{out.push(n);vis.add(n);srt(n).forEach(o=>{if(!vis.has(o.id))dfs(o.id);});};
  path.forEach(p=>{out.push(p);srt(p).forEach(o=>{if(!vis.has(o.id))dfs(o.id);});});});
 return out;}
function ttDefGap(a,b){const dm=ttDM(),d=dm.d[a+'|'+b];return(dm.tree[a+'|'+b]&&d!=null)?Math.max(.1,Math.round(d*100)/100):.8;}

function ttInit(){let T=W.tt;if(!T)T=W.tt={};

 const have=new Set(W.sts.map(s=>s.id)),o2=T.order.filter(id=>have.has(id));let ch=o2.length!==T.order.length;T.order=o2;
 const inO=new Set(T.order),miss=W.sts.filter(s=>!inO.has(s.id)).map(s=>s.id);
 if(miss.length){ch=true;if(!T.order.length){T.order=ttAutoOrder();T.gap={};T.gu={};}else miss.forEach(id=>T.order.push(id));}

/* layout แถวสถานี (+แถวชานชาลาเมื่อกางออก) */
function ttLay(){const T=ttInit(),k=JSON.stringify([T.order,T.gap,T.hid,T.exp,T.mode,T.rev])+NETV+'|'+W.edges.length;

 T.order.forEach((id,i)=>{if(i>0){sg+=+T.gap[id]||1;sn++;}});

 let acc=0,first=true,pend=0;const pos={},pfp={},list=[],rows=[],npf={},gk={};

  if(eq){if(vis&&!first){acc+=1;pend=1;}}else if(i>0){const gp=Math.max(.05,+(T.rev?T.gap[seq[i-1]]:T.gap[id])||1);acc+=gp;pend+=gp;}
  if(!vis)return;if(!first)gk[id]=pend;pend=0;first=false;pos[id]=acc;list.push(id);const pfs=ttPfs(id);npf[id]=pfs.length;rows.push({id,pf:null,p:acc});
  if(T.exp[id]&&pfs.length){pfp[id]={};pfs.forEach(pf=>{acc+=dl;pfp[id][pf]=acc;rows.push({id,pf,p:acc});});}});
 const anyExp=Object.keys(pfp).length>0,L={ids:list,pos,pfp,rows,npf,gk,total:acc,dl,anyExp,
  at:(st,pf)=>{const q=pfp[st];if(q&&pf!=null&&q[String(pf)]!=null)return q[String(pf)];return pos[st];}};

/* ── มุมมอง / ซูม ── */

 if(a==='thide'){const t=TR(x);if(t){t.tth=!t.tth;ttEdited();}ev.stopPropagation();return;}
 if(a==='hall'){W.trains.forEach(t=>t.tth=(x==='0'));ttEdited();return;}
 if(a==='mode'){T.mode=x;ttFit('p');renderLeft();return;}
 if(a==='auto'){if(!confirm('เรียงลำดับสถานีและตั้งระยะใหม่จากผังราง? (ค่าที่แก้เองจะถูกล้าง)'))return;T.order=ttAutoOrder();T.gap={};T.gu={};ttDefGaps(true);ttFit('p');renderLeft();return;}
 if(a==='calc'){T.gu={};ttDefGaps(true);ttFit('p');renderLeft();toast('คำนวณระยะระหว่างสถานีจากผังรางแล้ว');return;}
 if(a==='exp'){if(ttToggleExp(x))renderLeft();return;}
 if(a==='expall'){T.order.forEach(id=>{if(ttPfs(id).length)T.exp[id]=(x==='1');});ttFit('p');renderLeft();return;}
 if(a==='shid'){T.hid[x]=!T.hid[x];ttFit('p');renderLeft();return;}
 if(a==='up'||a==='dn'){const i=T.order.indexOf(x),j=a==='up'?i-1:i+1;if(i<0||j<0||j>=T.order.length)return;const o=T.order;[o[i],o[j]]=[o[j],o[i]];ttDefGaps(true);ttFit('p');renderLeft();return;}}
$('lp').addEventListener('click',ttPanelClick);
$('lp').addEventListener('change',ev=>{if(UI.tab!=='tt')return;const t=ev.target,d=t.dataset,T=ttInit();
 if(d.ttgap){const v=parseFloat(t.value);if(isNaN(v)||v<=0){toast('ระยะต้องมากกว่า 0','er');renderLeft();return;}T.gap[d.ttgap]=Math.max(.05,v);T.gu[d.ttgap]=1;ttFit('p');renderLeft();return;}
 if(d.tauto!=null){TT.auto=t.checked;return;}
 if(d.tmw!=null){const v=parseFloat(t.value);if(!isNaN(v)&&v>=0){TT.minWait=v;CF.sig=null;}renderLeft();return;}});
$('lp').addEventListener('input',ev=>{if(UI.tab==='tt'&&ev.target.dataset.tfilter!=null)ttFilterRows(ev.target.value);});
$('lp').addEventListener('toggle',ev=>{const d=ev.target;if(d.dataset&&d.dataset.sec)TT.open[d.dataset.sec]=d.open;},true);
/* ── ปุ่มแถบเครื่องมือ ── */
function ttSyncTb(){document.querySelectorAll('[data-tv]').forEach(b=>b.classList.toggle('on',!!TT[b.dataset.tv]));const T=W.tt||{};
 const s=$('tSwap'),r=$('tRev'),n=$('tSnap');if(s)s.classList.toggle('on',!!T.swap);if(r)r.classList.toggle('on',!!T.rev);if(n)n.textContent='ปัด '+(TT.snap<60?TT.snap+' วิ':TT.snap/60+' นาที');}
function ttEnter(){ttInit();TT.sig=ttSigNow();TT.chg=1;TT.sgT=0;TT.hover=null;ttSyncTb();requestAnimationFrame(()=>{ttResize();});}
$('ttb').addEventListener('click',ev=>{const b=ev.target.closest('button,[data-tv],[data-tz]');if(!b)return;const T=ttInit();
 if(b.dataset.tv){TT[b.dataset.tv]=!TT[b.dataset.tv];ttSyncTb();return;}
 const z=b.dataset.tz;if(z){if(z==='t-')ttZoomT(1/1.4);else if(z==='t+')ttZoomT(1.4);else if(z==='tf')ttFit('t');else if(z==='tall'){const v=ttView();v.t0=0;v.t1=86400;}
  else if(z==='p-')ttZoomP(1/1.4);else if(z==='p+')ttZoomP(1.4);else if(z==='pf')ttFit('p');return;}
 if(b.id==='tSwap'){ttSwap();return;}if(b.id==='tRev'){T.rev=!T.rev;ttFit('p');ttSyncTb();return;}
 if(b.id==='tPan'){TT.nopanel=!TT.nopanel;stageSync();return;}
 if(b.id==='tSnap'){const L=[10,30,60,300];TT.snap=L[(L.indexOf(TT.snap)+1)%L.length];ttSyncTb();return;}
 if(b.id==='tExp'){const any=T.order.some(id=>T.exp[id]);T.order.forEach(id=>{if(ttPfs(id).length)T.exp[id]=!any;});ttFit('p');renderLeft();return;}
 if(b.id==='tChk'){ttAnalyze(ttSigNow());toast(CF.ev.length?'พบความขัดแย้ง '+CF.ev.length+' จุด':'ไม่พบความขัดแย้ง');return;}
 if(b.id==='tPl'){play(!SIM.run);return;}if(b.id==='tRs'){$('cRs').click();return;}
 if(b.id==='tBk'){setClock(SIM.t-300);return;}if(b.id==='tFw'){setClock(SIM.t+300);return;}
 if(b.dataset.v){SIM.mul=+b.dataset.v;document.querySelectorAll('#spd .sx,#tSpd .sx').forEach(x=>x.classList.toggle('on',+x.dataset.v===SIM.mul));}});
$('tSpd').innerHTML=[1,5,10,25,60].map(v=>'<button class="sx'+(v===SIM.mul?' on':'')+'" data-v="'+v+'">'+v+'×</button>').join('');
TT.cv=$('tcv');TT.c=TT.cv.getContext('2d');
TT.cv.addEventListener('mousedown',ttDown);window.addEventListener('mousemove',ttMouse);window.addEventListener('mouseup',ttUp);
TT.cv.addEventListener('contextmenu',ttCtx);TT.cv.addEventListener('dblclick',ttDbl);TT.cv.addEventListener('wheel',ttWheel,{passive:false});
TT.cv.addEventListener('mouseleave',()=>{TT.cx=null;TT.hover=null;TT.hovRow=null;});
window.addEventListener('keydown',e=>{if(UI.tab!=='tt'||/input|select|textarea/i.test(e.target.tagName))return;const tr=TT.sel?TR(TT.sel):null,k=e.key.toLowerCase();
 if((e.key==='Delete'||e.key==='Backspace')&&tr){e.preventDefault();ttDel(tr);}
 else if((e.ctrlKey||e.metaKey)&&k==='c'&&tr){e.preventDefault();ttCopy(tr);}
 else if((e.ctrlKey||e.metaKey)&&k==='v'&&TT.clip&&TT.M&&TT.cx!=null){e.preventDefault();ttPaste(ttSnap(Math.max(0,TT.M.sc(TT.cx,TT.cy).t)));}
 else if(k==='e'&&tr&&!e.ctrlKey&&!e.metaKey){e.preventDefault();ttEditDlg(tr);}});
if(window.ResizeObserver)new ResizeObserver(()=>{if(UI.tab==='tt')ttResize();}).observe($('tcw'));

/* ═════════ ลูปหลัก ═════════ */
let last=0,acc=0,sav=0,fsv=0;
function loop(ts){const dt=Math.min(.1,(ts-(last||ts))/1000);last=ts;
 if(SIM.run){let s=dt*SIM.mul;while(s>1e-6){const h=Math.min(.25,s);tick(h);s-=h;}}
 if(GH.on)GH.ph+=dt*GH.spd*70;
 $('ct').innerHTML=hm(SIM.t)+'<small>:'+p2(Math.floor(((SIM.t%60)+60)%60))+'</small>';
 if(UI.tab==='tt'){ttWatch();ttDraw();}else draw();acc+=dt;sav+=dt;fsv+=dt;
 if(acc>.8){acc=0;renderUpc();renderHud();
  const ae=document.activeElement;if(!LPH&&!(ae&&$('lp').contains(ae)&&/input|select/i.test(ae.tagName))&&UI.tab==='tr')renderLeft();
  const tm=document.querySelector('.pj.on .tm');if(tm)tm.textContent=hm(SIM.t);}
 if(sav>2){sav=0;pjSave();}
 if(fsv>8){fsv=0;if(FS.h)fsWrite();}
 requestAnimationFrame(loop);}
window.addEventListener('resize',resize);
window.addEventListener('beforeunload',()=>pjSave(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden){pjSave(true);if(FS.h)fsWrite();}});
let TH0='dark';try{TH0=localStorage.getItem('redline_theme')||'dark';}catch(e){}
setTheme(TH0);
resize();reindex();
(async function boot(){let o=null;
 try{const s=localStorage.getItem('redline_projects');if(s)o=JSON.parse(s);}catch(e){}
 if(!(o&&o.list&&o.list.length)){const s2=await idbGet('ws');if(s2){try{o=JSON.parse(s2);}catch(e){}}}
 if(o&&o.list&&o.list.length){PJ=o;if(!pjCur())PJ.act=PJ.list[0].id;pjOpen(PJ.act,true);}
 else{let data=null;try{const s=localStorage.getItem('railflow_v1');if(s){const q=JSON.parse(s);if(q.nodes&&q.nodes.length)data=q;}}catch(e){}
  const p=pjNew('กรณีที่ 1',data);PJ.act=p.id;pjOpen(p.id,true);}
 const h=await idbGet('fsh');if(h){FS.pend=h;}renderFs();
 play(false);requestAnimationFrame(loop);})();
</script>
